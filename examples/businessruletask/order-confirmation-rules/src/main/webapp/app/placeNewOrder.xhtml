<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	template="/WEB-INF/templates/template.xhtml">
		
<ui:define name="content">
	
	<h2>Place a New Order</h2>

	<h:form class="form-horizontal">
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="company">Company name:</label>
            <div class="col-sm-10">
                <h:inputText id="company" value="#{newOrder.customer.company}" styleClass="form-control" />
                <h:message id="company_error" for="company" errorClass="invalid" />
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="email">Email:</label>
            <div class="col-sm-10">
                <h:inputText id="email" value="#{newOrder.customer.email}" styleClass="form-control" />
                <h:message id="email_error" for="email" errorClass="invalid" />
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="amount">Amount:</label>
            <div class="col-sm-10">
                <h:inputText id="amount" value="#{newOrder.amount}" styleClass="form-control" />
                <h:message id="amount_error" for="amount" errorClass="invalid" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="offset-sm-2 col-sm-10">
                <h:commandButton action="#{newOrderController.save()}" value="save" type="submit" class="btn btn-primary"/>
            </div>
        </div>
	</h:form>

	</ui:define>
</ui:composition>
