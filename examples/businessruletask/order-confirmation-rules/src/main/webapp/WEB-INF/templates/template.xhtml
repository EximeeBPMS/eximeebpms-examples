<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets">
<h:head>
	<title>EximeeBPMS BPM Demo - Order Confirmation Rules</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel='stylesheet' href='${request.contextPath}/webjars/bootstrap/5.3.8/css/bootstrap.min.css'/>
    <h:outputStylesheet name="css/screen.css" />
</h:head>

<h:body>
    <h:form>
        <nav class="navbar navbar-expand bg-body-tertiary sticky-top">
            <div class="container">
                <span class="navbar-brand">EximeeBPMS BPM Demo</span>
                <ul class="navbar-nav">
                    <li id="book" class="nav-item"><h:outputLink value="taskList.jsf" styleClass="nav-link">Task list</h:outputLink></li>
                    <li id="contents" class="nav-item"><h:outputLink value="placeNewOrder.jsf" styleClass="nav-link">Place new order</h:outputLink></li>
                    <li id="start" class="nav-item"><h:outputLink value="orderList.jsf" styleClass="nav-link">Order list</h:outputLink></li>

	<div id="main">

                    <h1>Order Confirmation Rules</h1>
                    <p class="marketing-byline">With the <a href="https://eximeebpms.org">EximeeBPMS BPM platform</a>, <a href="http://www.oracle.com/technetwork/java/javaee/overview/index.html">Java EE 6</a> and <a href="http://www.jboss.org/drools/">JBoss Drools</a><br/>

            </div>
            <h:panelGroup styleClass="row">
                <h:messages globalOnly="true"/>
                <ui:insert name="content">Main Content</ui:insert>
            </h:panelGroup>
        </div>
        <footer>
            <div class="container">
                <hr/>
                <div class="row">
                    <div class="col-8">&nbsp;</div>
                    <div class="col-4" style="white-space: nowrap; text-align: right">Powered by <a style="font-weight: bold;" href="https://eximeebpms.org">EximeeBPMS BPM platform</a></div>
                </div>
            </div>
        </footer>
	</div>
