name: Release Mockito

# Publishes mockito/ (org.eximeebpms.bpm.extension.mockito:eximeebpms-bpm-mockito) to
# Maven Central. Manual only.
#
# Unlike assert-scenario, this is a fork of a long-mature, stable library (5.x releases
# over several years) - there's no "upstream never stabilized" situation here, so the
# first release should be a genuine 1.0.0, not an alpha.
#
# Same trimmed-down mechanics as release-archetypes.yml/release-assert-scenario.yml - see
# release-archetypes.yml's header comment for what was deliberately left out (SBOM,
# cosign, self-hosted runner, GitHub App token).

permissions:
  contents: write

concurrency:
  group: release-mockito-${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
      development_version:
        description: 'Next snapshot version (e.g. 1.0.1) without -SNAPSHOT suffix'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockito
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create custom settings.xml
        run: |
          mkdir -p ~/.m2-release
          cat <<EOF > ~/.m2-release/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CPP_USERNAME}</username>
                <password>${CPP_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
          CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > private.key
          gpg --batch --import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Git user
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Configure Git remote for push
        # maven-release-plugin pushes using the pom's scm connection URL (now https,
        # not ssh - no SSH key exists on the runner), but still needs credentials on
        # that remote. actions/checkout persists a token-authenticated origin remote
        # for its own use; re-apply the same token explicitly here so the release
        # plugin's own git push (which touches origin) is authenticated too.
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release prepare
        run: |
          mvn release:prepare -B --settings ~/.m2-release/settings.xml \
            -Darguments="-DskipTests -Prelease" \
            -DtagNameFormat=mockito-v@{project.version} \
            -DreleaseVersion=${{ github.event.inputs.release_version }} \
            -DdevelopmentVersion=${{ github.event.inputs.development_version }}-SNAPSHOT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release perform (checkout the tag only, no deploy yet)
        run: |
          mvn release:perform --settings ~/.m2-release/settings.xml -Dgoals="" \
            -Darguments="-DskipTests"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (stage locally, no network)
        run: |
          cd target/checkout
          mvn deploy -Prelease -B --settings ~/.m2-release/settings.xml -DskipTests \
            -DaltDeploymentRepository=local::file:$(pwd)/target/staging-deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish staged artifacts to Maven Central (JReleaser)
        uses: jreleaser/release-action@v2
        with:
          version: '1.19.0'
          working-directory: mockito/target/checkout
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CPP_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CPP_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mockito v${{ github.event.inputs.release_version }}
          tag_name: mockito-v${{ github.event.inputs.release_version }}
          draft: false
          prerelease: false
          body: |
            EximeeBPMS Mockito ${{ github.event.inputs.release_version }}.
            Staged to the Central Publisher Portal - awaiting manual publish confirmation:
            https://central.sonatype.com/publishing/deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# (no functional change - re-saved to force GitHub Actions to (re-)discover this workflow file)
