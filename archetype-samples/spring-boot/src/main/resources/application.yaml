spring.datasource:
  url: jdbc:h2:./eximeebpms-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#shareable h2 database: jdbc:h2:./eximeebpms-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
  username: sa
  password: sa
spring.h2.console.enabled: true
eximeebpms.bpm:
  admin-user:
    id: demo
    password: demo
    firstName: Demo
    lastName: Demo
  filter:
    create: All Tasks
#  default-serialization-format: application/json
server.port: 8080

# eximeebpms-bpm-spring-boot-monitor (pulled in by the REST starter) ships
# these defaults in classpath:library.properties, but the FEEL engine's
# shaded Scala jar has a file of the same name and usually wins the lookup,
# so the placeholders stay unresolved and the application fails to start.
# Values match the monitor's own defaults. Remove once BPMS-797 is fixed.
eximeebpms.monitoring.snapshot.enabled: true
eximeebpms.monitoring.snapshot.updateRate: 10000
