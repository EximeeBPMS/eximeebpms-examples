eximeebpms.bpm:
  admin-user:
    id: demo
    password: demo
  client:
    base-url: http://localhost:8080/engine-rest # The URL pointing to the EximeeBPMS Runtime REST API
    async-response-timeout: 1000 # Defines the maximum duration of the long-polling request
    worker-id: spring-boot-client # Identifies the worker towards the Engine
#      basic-auth: # Configure if REST API is secured with basic authentication
#        username: my-username
#        password: my-password
    subscriptions:
      creditScoreChecker: # This topic name must match the respective `@ExternalTaskSubscription`
        process-definition-key: loan_process # Filters for External Tasks of this key
        auto-open: false # Defines whether the subscription is opened automatically or not
      loanGranter:
        lock-duration: 10000 # Defines for how long the External Tasks are locked until they can be fetched again

logging.level.org.eximeebpms.bpm.client: info

# eximeebpms-bpm-spring-boot-monitor (pulled in by the REST starter) ships
# these defaults in classpath:library.properties, but the FEEL engine's
# shaded Scala jar has a file of the same name and usually wins the lookup,
# so the placeholders stay unresolved and the application fails to start.
# Values match the monitor's own defaults. Remove once BPMS-797 is fixed.
eximeebpms.monitoring.snapshot.enabled: true
eximeebpms.monitoring.snapshot.updateRate: 10000
