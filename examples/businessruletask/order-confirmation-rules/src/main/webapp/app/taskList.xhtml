<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	template="/WEB-INF/templates/template.xhtml">
<ui:define name="content">

	<h2>Task List</h2>
	
    <h:form class="row g-2 align-items-center mb-3">
        <div class="col-auto"><label class="col-form-label" for="currentUser">Logged in user: </label></div>
        <div class="col-auto"><h:inputText id="currentUser" value="#{taskList.currentUser}" class="form-control form-control-sm"/></div>
        <div class="col-auto"><h:commandButton action="#{taskList.update()}" value="update" type="submit" class="btn btn-primary btn-sm"/></div>
    </h:form>
	
	<h:form>
	<h:dataTable value="#{taskList.list}" var="thisTask" id="list" cellspacing="0" rowClasses="odd, even" styleClass="table table-striped table-bordered">
			<h:column><f:facet name="header">ID</f:facet>#{thisTask.id}</h:column>
			<h:column><f:facet name="header">name</f:facet><strong>#{thisTask.name}</strong></h:column>
			<h:column><f:facet name="header">creation time</f:facet>#{thisTask.createTime}</h:column>
			<h:column><f:facet name="header">due date</f:facet>#{thisTask.dueDate}</h:column>
			<h:column><f:facet name="header">assignee</f:facet>#{thisTask.assignee}</h:column>
			<h:column><f:facet name="header">actions</f:facet>
				<h:commandLink action="#{taskList.claim(thisTask)}" value="claim" type="submit" class="btn btn-secondary btn-sm"/>
				<h:commandLink action="#{taskList.unclaim(thisTask)}" value="release" type="submit" class="btn btn-secondary btn-sm"/>
				<h:outputLink value="#{taskList.getFormKey(thisTask)}?taskId=#{thisTask.id}" class="btn btn-secondary btn-sm">complete</h:outputLink>
			</h:column>		
	</h:dataTable>	
	</h:form>	
</ui:define>
</ui:composition>
