name: Release Assert Scenario

# Publishes assert-scenario/'s 4 library modules (runner, report, cucumber, deprecated -
# org.eximeebpms.bpm.extension.scenario:*) to Maven Central. The example/ module is
# excluded on purpose (maven-install/deploy-plugin already skip=true there - it's a demo,
# not a distributable library).
#
# Manual only. First release should be an alpha (e.g. 1.0.0-alpha.1): the upstream
# camunda-platform-scenario project this was forked from never shipped a stable 2.0.0
# release either (only 2.0.0-alpha.1/.2 exist on Maven Central) - since Camunda 7 is no
# longer developed, waiting for upstream to reach stable is pointless, but the code's own
# maturity hasn't changed just because we rebranded it, so this fork starts its own
# version line (1.x) at the same honesty level upstream left off at, rather than jumping
# straight to a "1.0.0" that overclaims stability upstream itself never confirmed.
#
# maven-release-plugin needs to push a version-bump commit and a tag directly to master.
# master has a "changes must go through a pull request" repository rule (ruleset id
# 20975287) - the default GITHUB_TOKEN (github-actions[bot]) has no bypass on it. The real
# eximeebpms (engine) release pipeline hits the exact same rule on its own main branch and
# solves it by authenticating as the "eximeebpmsrunner" GitHub App instead, which IS listed
# as a bypass actor there - mirrored here rather than reinvented, once the same app is
# granted access to this repo and added to this repo's own ruleset bypass list too.
#
# Same trimmed-down mechanics as release-archetypes.yml otherwise - see that file's header
# comment for what was deliberately left out (SBOM, cosign, self-hosted runner).

permissions:
  contents: write

concurrency:
  group: release-assert-scenario-${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.0.0-alpha.1)'
        required: true
      development_version:
        description: 'Next snapshot version (e.g. 1.0.0) without -SNAPSHOT suffix'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assert-scenario
    steps:
      - name: Generate eximeebpmsrunner app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EXIMEEBPMSRUNNER_APP_ID }}
          private-key: ${{ secrets.EXIMEEBPMSRUNNER_APP_PRIVATE_KEY }}

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create custom settings.xml
        run: |
          mkdir -p ~/.m2-release
          cat <<EOF > ~/.m2-release/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CPP_USERNAME}</username>
                <password>${CPP_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
          CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > private.key
          gpg --batch --import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Git user
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Release prepare
        run: |
          mvn release:prepare -B --settings ~/.m2-release/settings.xml \
            -Darguments="-DskipTests -Prelease" \
            -DtagNameFormat=assert-scenario-v@{project.version} \
            -DreleaseVersion=${{ github.event.inputs.release_version }} \
            -DdevelopmentVersion=${{ github.event.inputs.development_version }}-SNAPSHOT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release perform (checkout the tag only, no deploy yet)
        run: |
          mvn release:perform --settings ~/.m2-release/settings.xml -Dgoals="" \
            -Darguments="-DskipTests"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Deploy (stage locally, no network)
        run: |
          cd target/checkout
          mvn deploy -Prelease -B --settings ~/.m2-release/settings.xml -DskipTests \
            -DaltDeploymentRepository=local::file:$(pwd)/target/staging-deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish staged artifacts to Maven Central (JReleaser)
        uses: jreleaser/release-action@v2
        with:
          version: '1.19.0'
          working-directory: assert-scenario/target/checkout
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CPP_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CPP_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Assert Scenario v${{ github.event.inputs.release_version }}
          tag_name: assert-scenario-v${{ github.event.inputs.release_version }}
          draft: false
          prerelease: true
          body: |
            EximeeBPMS Platform Scenario ${{ github.event.inputs.release_version }}.
            Staged to the Central Publisher Portal - awaiting manual publish confirmation:
            https://central.sonatype.com/publishing/deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
