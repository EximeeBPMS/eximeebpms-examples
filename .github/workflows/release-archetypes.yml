name: Release Archetypes

# Publishes the 7 archetype-templates/ Maven Archetypes (org.eximeebpms.bpm.archetype:*)
# to Maven Central. Manual only - run this after a new EximeeBPMS engine version ships
# and the archetypes' own version.eximeebpms property has been bumped to match.
#
# Mirrors the real eximeebpms (engine) release pipeline's Maven Central mechanics
# (release profile -> stage locally -> JReleaser uploads the staged bundle), trimmed
# down for a small, dependency-light Maven Archetype reactor: no SBOM generation, no
# Sigstore/cosign signing, no chained snapshot release, no self-hosted runner - those
# are engine-specific additions this repo doesn't need.
#
# maven-release-plugin needs to push a version-bump commit and a tag directly to master.
# master has a "changes must go through a pull request" repository rule (ruleset id
# 20975287) - the default GITHUB_TOKEN (github-actions[bot]) has no bypass on it. The real
# eximeebpms (engine) release pipeline hits the exact same rule on its own main branch and
# solves it by authenticating as the "eximeebpmsrunner" GitHub App instead, which IS listed
# as a bypass actor there - mirrored here rather than reinvented, once the same app is
# granted access to this repo and added to this repo's own ruleset bypass list too.
#
# The upload lands in the Central Publisher Portal (https://central.sonatype.com/publishing/deployments)
# awaiting manual confirmation - this workflow does not auto-publish.

permissions:
  contents: write

concurrency:
  group: release-archetypes-${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.4.0)'
        required: true
      development_version:
        description: 'Next snapshot version (e.g. 1.4.0) without -SNAPSHOT suffix'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archetype-templates
    steps:
      - name: Generate eximeebpmsrunner app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EXIMEEBPMSRUNNER_APP_ID }}
          private-key: ${{ secrets.EXIMEEBPMSRUNNER_APP_PRIVATE_KEY }}

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create custom settings.xml
        run: |
          mkdir -p ~/.m2-release
          cat <<EOF > ~/.m2-release/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CPP_USERNAME}</username>
                <password>${CPP_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          CPP_USERNAME: ${{ secrets.CPP_USERNAME }}
          CPP_PASSWORD: ${{ secrets.CPP_PASSWORD }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode > private.key
          gpg --batch --import private.key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure Git user
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'

      - name: Release prepare
        run: |
          ./mvnw release:prepare -B --settings ~/.m2-release/settings.xml \
            -Darguments="-DskipTests -Prelease" \
            -DtagNameFormat=archetypes-v@{project.version} \
            -DreleaseVersion=${{ github.event.inputs.release_version }} \
            -DdevelopmentVersion=${{ github.event.inputs.development_version }}-SNAPSHOT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Release perform (checkout the tag only, no deploy yet)
        run: |
          ./mvnw release:perform --settings ~/.m2-release/settings.xml -Dgoals="" \
            -Darguments="-DskipTests"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Deploy (stage locally, no network)
        # release:perform clones the whole eximeebpms-examples monorepo into
        # target/checkout (archetype-templates's scm points at the repo, not a
        # standalone archetype-templates-only repo) - the actual project lives one
        # level down, at target/checkout/archetype-templates, same path
        # release:perform's own internal "run-perform-goals" phase already uses.
        run: |
          cd target/checkout/archetype-templates
          ./mvnw deploy -Prelease -B --settings ~/.m2-release/settings.xml -DskipTests \
            -DaltDeploymentRepository=local::file:$(pwd)/target/staging-deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish staged artifacts to Maven Central (JReleaser)
        uses: jreleaser/release-action@v2
        with:
          version: '1.19.0'
          working-directory: archetype-templates/target/checkout/archetype-templates
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.release_version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CPP_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CPP_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Archetypes v${{ github.event.inputs.release_version }}
          tag_name: archetypes-v${{ github.event.inputs.release_version }}
          draft: false
          prerelease: false
          body: |
            EximeeBPMS Maven Archetypes ${{ github.event.inputs.release_version }}.
            Staged to the Central Publisher Portal - awaiting manual publish confirmation:
            https://central.sonatype.com/publishing/deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
