<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	template="/WEB-INF/templates/template.xhtml">	
<ui:define name="content">

	<f:metadata>
		<f:viewParam name="taskId" />
		<f:event type="preRenderView" listener="#{businessProcess.startTask(taskId, true)}" />            
   	</f:metadata>
	
	<h2>#{task.name}</h2>
	
	<h:form class="form-horizontal">
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="company">Company:</label>
            <div class="col-sm-10">
                <span class="form-control-plaintext">#{orderEntity.customer.company}</span>
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="amount">Amount:</label>
            <div class="col-sm-10">
                <span class="form-control-plaintext">#{orderEntity.amount}</span>
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="discount">Discount:</label>
            <div class="col-sm-10">
                <span class="form-control-plaintext">#{orderEntity.discount}</span>
            </div>
        </div>
        <div class="row mb-3">
            <div class="offset-sm-2 col-sm-10">
                <div class="form-check">
                    <h:selectBooleanCheckbox id="valid" styleClass="form-check-input"
                                             value="#{processVariables['orderApproved']}"
                                             required="true" />
                    <label class="form-check-label" for="valid">Is this order OK?</label>
                    <h:message for="valid"/>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="offset-sm-2 col-sm-10">
                <h:commandButton action="#{businessProcess.completeTask(true)}" value="Done" type="submit" class="btn btn-primary"/>
            </div>
        </div>
	</h:form>
</ui:define>
</ui:composition>
